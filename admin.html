<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>অ্যাডমিন — Our Scout Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#c1121f;--bg:#f5f5f5;--b:#e4e4e4;--m:#777}
*{box-sizing:border-box;margin:0}body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:#222;padding-bottom:70px}
.top{background:var(--p);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;font-weight:700}.top button{width:auto;background:#fff3;padding:5px 10px;margin:0;font-size:13px}
#app{display:none;max-width:760px;margin:auto;padding:10px}.c{background:#fff;border-radius:12px;padding:12px;margin:8px 0;border:1px solid var(--b)}
input,select,textarea,button{font:inherit;width:100%;padding:9px;margin:4px 0;border:1px solid #ccc;border-radius:8px}button{background:var(--p);color:#fff;border:0;font-weight:600;cursor:pointer}button.g{background:#fff;color:var(--p);border:1px solid var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;z-index:9}nav button{background:none;color:var(--m);margin:0;border:0;border-radius:0;font-size:11px;padding:7px 0}nav button.on{color:var(--p)}nav b{display:block;font-size:19px}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.st .c{margin:0;text-align:center}.st b{font-size:24px;color:var(--p);display:block}.st span{font-size:13px;color:var(--m)}
.r{display:flex;gap:8px;align-items:center}.r button{width:auto;margin:0}.hm{color:var(--m);font-size:13px}.im{width:54px;height:54px;border-radius:8px;background:var(--bg) center/cover;flex:none;display:flex;align-items:center;justify-content:center}
.br{display:flex;align-items:flex-end;gap:6px;height:90px}.br div{flex:1;background:var(--p);border-radius:4px 4px 0 0;position:relative;min-height:3px}.br i{position:absolute;top:-16px;width:100%;text-align:center;font-size:11px;font-style:normal}
.bg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--b)}#lg{max-width:420px;margin:30px auto;padding:0 12px}iframe{width:100%;height:60vh;border:1px solid var(--b);border-radius:10px;background:#fff}
#pv{width:100%;max-height:140px;object-fit:contain;border-radius:8px;margin-top:4px}small{color:var(--p)}
/* Typography: Bengali = Hind Siliguri */
html{-webkit-text-size-adjust:100%}body{font-weight:400;line-height:1.6;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;font-kerning:normal}
h1,h2,h3,h4{font-weight:700;line-height:1.5}button,.b1,.b2,.pb{font-weight:600}nav button{font-weight:500;line-height:1.4}
.ic,.bd,.fl,.cd,.im,.of,.ct b,.dots,.sbt,.mid i,.top button{line-height:1.2}
</style></head><body>
<div class="top"><span>⚜ Our Scout Shop — অ্যাডমিন</span><button onclick="location.reload()" id="lo" style="display:none">লগআউট</button></div>
<div id="lg"><div class="c"><b>🔐 অ্যাডমিন লগইন</b><input id="em" type="email" placeholder="ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড"><button onclick="login()">লগইন</button><small id="er"></small></div></div>
<div id="app"><div id="v"></div></div>
<nav id="nv" style="display:none"><button data-t="d"><b>📊</b>ড্যাশবোর্ড</button><button data-t="p"><b>📦</b>পণ্য</button><button data-t="o"><b>🧾</b>অর্ডার</button><button data-t="w"><b>🌐</b>সাইট</button><button data-t="s"><b>⚙️</b>সেটিংস</button></nav>
<script>
const CFG={pid:"our-scout-shop-43eed",key:"AIzaSyAtz9Auey9DivSmMc80x0w5V6GVOwj4qCg"};
const CATS=['স্কার্ফ','কাব স্কাউট বই','স্কাউট বই','রোভার বই','হ্যান্ডবুক ও অন্যান্য','খাতা','কি-রিং','কাপড়','ওয়াগল','পোশাক ব্যাজ'],ST=['নতুন','কনফার্মড','পাঠানো হয়েছে','ডেলিভারড','বাতিল','রিটার্ন'];
const base=`https://firestore.googleapis.com/v1/projects/${CFG.pid}/databases/(default)/documents`,$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),N=n=>(+n||0).toLocaleString('bn-BD'),T=n=>'৳'+N(Math.round(n));
let tk='',UE='',W=[],P=[],O=[],R=[],IMG='',cur='d',of='';
const tf=o=>{const f={};for(const k in o){const v=o[k];f[k]=typeof v=='boolean'?{booleanValue:v}:typeof v=='number'?{doubleValue:v}:{stringValue:String(v??'')}}return{fields:f}};
const fv=d=>{const o={id:d.name.split('/').pop(),ct:d.createTime};for(const k in d.fields||{}){const v=d.fields[k];o[k]=v.stringValue??v.doubleValue??v.integerValue??v.booleanValue}return o};
const api=async(m,p,b)=>{const r=await fetch(base+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:b&&JSON.stringify(b)});const j=await r.json();if(j.error)throw new Error(j.error.message);return j};
const ls=async c=>((await api('GET','/'+c+'?pageSize=300')).documents||[]).map(fv);
async function login(){try{const r=await(await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CFG.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value,returnSecureToken:true})})).json();if(r.error)throw 0;tk=r.idToken;UE=r.email||'';$('#lg').style.display='none';$('#app').style.display='block';$('#nv').style.display='flex';$('#lo').style.display='';tab('d')}catch{$('#er').textContent='লগইন ব্যর্থ — ইমেইল/পাসওয়ার্ড দেখুন'}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
async function tab(t){cur=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('#v').innerHTML='<p class="hm" style="padding:20px">লোড হচ্ছে...</p>';scrollTo(0,0);
 try{if(t=='d'||t=='o'||t=='p'){W=[];const sf=(c,x=true)=>ls(c).catch(()=>{x&&W.push(c);return[]});[P,O,R]=await Promise.all([sf('products'),sf('orders'),sf('ratings',false)]);O.sort((a,b)=>(b.ct||'').localeCompare(a.ct||''))}
 ({d:dash,p:()=>pv(),o:ov,w:web,s:sv})[t]();if(W.length&&t!='w'&&t!='s')$('#v').insertAdjacentHTML('afterbegin','<div class="c"><small>⚠️ ডেটা পড়া যায়নি ('+W.join(', ')+')। Firestore Rules-এ অ্যাডমিন ইমেইল ঠিক আছে কি না ও Publish হয়েছে কি না দেখুন। আপনি এই ইমেইলে লগইন করেছেন: <b>'+E(UE)+'</b> — Rules-এর ইমেইলও ঠিক এটাই হতে হবে (ছোট হাতের অক্ষরে)।</small></div>')}catch(e){$('#v').innerHTML='<div class="c"><small>ত্রুটি: '+E(e.message)+'</small></div>'}}
function dash(){const n=s=>O.filter(o=>o.status==s).length,dl=O.filter(o=>o.status=='ডেলিভারড'),rv=dl.reduce((a,o)=>a+(+o.total||0),0),td=O.filter(o=>o.ct&&new Date(o.ct).toDateString()==new Date().toDateString()).length,
 av=R.length?R.reduce((a,r)=>a+(+r.stars||0),0)/R.length:0,days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:d.getDate(),c:O.filter(o=>o.ct&&new Date(o.ct).toDateString()==d.toDateString()).length}}),mx=Math.max(1,...days.map(d=>d.c));
 const card=(a,b)=>`<div class="c"><b>${a}</b><span>${b}</span></div>`;
 $('#v').innerHTML=`<div class="st">${card(N(O.length),'মোট অর্ডার')}${card(N(td),'আজকের অর্ডার')}${card(N(n('নতুন')),'নতুন (পেন্ডিং)')}${card(N(n('ডেলিভারড')),'ডেলিভারড')}${card(N(n('বাতিল')),'বাতিল অর্ডার')}${card(N(n('রিটার্ন')),'রিটার্ন')}${card(T(rv),'আয় (ডেলিভারড)')}${card('⭐ '+(av?N(Math.round(av*10)/10):'—'),'অর্ডার রেটিং ('+N(R.length)+' জন)')}</div>
 <div class="c"><b>গত ৭ দিনের অর্ডার</b><div class="br" style="margin-top:22px">${days.map(d=>`<div style="height:${d.c/mx*100}%"><i>${d.c?N(d.c):''}</i></div>`).join('')}</div><div class="br" style="height:auto;margin-top:4px">${days.map(d=>`<span class="hm" style="flex:1;text-align:center">${N(d.l)}</span>`).join('')}</div></div>
 <div class="c"><b>অর্ডারের অবস্থা</b>${ST.map(s=>`<div style="margin:6px 0"><div class="r" style="justify-content:space-between"><span>${s}</span><b>${N(n(s))}</b></div><div style="background:var(--bg);border-radius:4px;height:7px"><div style="background:var(--p);height:7px;border-radius:4px;width:${O.length?n(s)/O.length*100:0}%"></div></div></div>`).join('')}</div>
 <div class="c"><b>সর্বশেষ রেটিং</b>${R.slice(-5).reverse().map(r=>`<div class="r" style="justify-content:space-between"><span class="hm">${E(r.no)}</span><span>${'⭐'.repeat(+r.stars||0)}</span></div>`).join('')||'<p class="hm">এখনও কোনো রেটিং আসেনি</p>'}</div>`}
function pv(p={}){IMG=p.img||'';const q=$('#sq')?.value||'';
 $('#v').innerHTML=`<div class="c"><b>${p.id?'✏️ পণ্য সম্পাদনা':'➕ নতুন পণ্য যোগ'}</b><input id="a1" placeholder="পণ্যের নাম" value="${E(p.name)}"><select id="a2">${CATS.map(c=>`<option ${p.cat==c?'selected':''}>${c}</option>`).join('')}</select><input id="a3" type="number" placeholder="দাম (৳)" value="${p.price||''}"><input id="a4" type="number" placeholder="আগের দাম (ছাড় দেখাতে, ঐচ্ছিক)" value="${p.old||''}">
 <label class="hm">📷 ছবি আপলোড (ফোন গ্যালারি/ক্যামেরা)</label><input type="file" id="a7" accept="image/*" onchange="pick(this)"><img id="pv" ${IMG?`src="${E(IMG)}"`:'style="display:none"'}>
 <label><input type="checkbox" id="a6" style="width:auto" ${p.hot=='true'||p.hot===true?'checked':''}> 🔥 Hot Deal-এ দেখান</label><button onclick="sp('${p.id||''}')">সেভ করুন</button>${p.id?'<button class="g" onclick="pv()">বাতিল</button>':''}</div>
 <input id="sq" placeholder="🔍 পণ্য খুঁজুন" value="${E(q)}" oninput="pl()"><div id="pl"></div>`;pl()}
function pl(){const q=$('#sq').value;$('#pl').innerHTML=P.map((x,i)=>[x,i]).filter(([x])=>!q||(x.name+x.cat).includes(q)).map(([x,i])=>`<div class="c r"><div class="im" style="${x.img?`background-image:url('${E(x.img)}')`:''}">${x.img?'':'📦'}</div><div style="flex:1">${E(x.name)}<br><span class="hm">${E(x.cat)} · ${T(x.price)}</span></div><button class="g" onclick="pv(P[${i}])">✏️</button><button onclick="dp('${x.id}')">🗑</button></div>`).join('')||'<p class="hm">কোনো পণ্য নেই</p>'}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);IMG=c.toDataURL('image/jpeg',.7);$('#pv').src=IMG;$('#pv').style.display='block'};im.src=r.result};r.readAsDataURL(f)}
async function sp(id){const o={name:$('#a1').value.trim(),cat:$('#a2').value,price:+$('#a3').value,old:+$('#a4').value||0,img:IMG,hot:$('#a6').checked};if(!o.name||!o.price)return alert('নাম ও দাম দিন');try{id?await api('PATCH','/products/'+id,tf(o)):await api('POST','/products',tf(o));alert('সেভ হয়েছে ✅');tab('p')}catch(e){alert(e.message)}}
async function dp(id){if(confirm('মুছে ফেলবেন?')){try{await api('DELETE','/products/'+id);tab('p')}catch(e){alert(e.message)}}}
function ov(){const l=O.filter(o=>!of||o.status==of);$('#v').innerHTML=`<select onchange="of=this.value;ov()"><option value="">সব অর্ডার (${N(O.length)})</option>${ST.map(s=>`<option ${of==s?'selected':''}>${s}</option>`).join('')}</select>`+(l.map(o=>{let it=[];try{it=JSON.parse(o.items)}catch{}return`<div class="c"><div class="r" style="justify-content:space-between"><b>${E(o.no)}</b><span class="bg">${E(o.status)}</span></div><span class="hm">${E(o.at)}</span><br>👤 ${E(o.name)} · <a href="tel:${E(o.phone)}">${E(o.phone)}</a><br>📍 ${E(o.address)}<br><span class="hm">${it.map(x=>E(x.n)+' ×'+x.q).join(', ')}</span><br>মোট <b>${T(o.total)}</b> · অগ্রিম ${T(o.advance)} · বাকি ${T(o.due)}<br><span class="hm">${E(o.method)} · প্রেরক ${E(o.sender)} · TrxID ${E(o.trx)}${o.custom=='true'||o.custom===true?' · কাস্টমাইজ':''}${o.note?' · '+E(o.note):''}</span><select onchange="us('${o.id}',this.value)">${ST.map(s=>`<option ${o.status==s?'selected':''}>${s}</option>`).join('')}</select><a href="https://wa.me/88${E(o.phone)}" target="_blank" style="color:var(--p)">💬 গ্রাহককে WhatsApp</a></div>`}).join('')||'<p class="hm" style="padding:12px">কোনো অর্ডার নেই</p>')}
async function us(id,s){try{await api('PATCH','/orders/'+id+'?updateMask.fieldPaths=status',{fields:{status:{stringValue:s}}});const o=O.find(x=>x.id==id);if(o)o.status=s}catch(e){alert(e.message)}}
function web(){const u=location.href.replace(/admin\.html.*$/,'');$('#v').innerHTML=`<div class="c"><b>🌐 লাইভ ওয়েবসাইট</b><p class="hm" style="word-break:break-all">${E(u)}</p><div class="r"><button onclick="open('${E(u)}','_blank')">সাইট খুলুন ↗</button><button class="g" onclick="navigator.clipboard.writeText('${E(u)}');alert('লিংক কপি হয়েছে')">লিংক কপি</button></div></div><iframe src="${E(u)}"></iframe><p class="hm">ওপরে সাইটের বর্তমান অবস্থা দেখা যাচ্ছে।</p>`}
async function sv(){let s={};try{s=fv(await api('GET','/settings/main'))}catch{}$('#v').innerHTML=`<div class="c"><b>টিকারের লেখা</b><input id="s1" value="${E(s.ticker)}"><b>ব্যানার</b> <span class="hm">(প্রতি লাইনে: শিরোনাম|ক্যাটাগরি|ছবির লিংক)</span><textarea id="s2" rows="6">${E(s.banners)}</textarea><button onclick="ss()">সেটিংস সেভ</button></div>`}
async function ss(){try{await api('PATCH','/settings/main',tf({ticker:$('#s1').value,banners:$('#s2').value}));alert('সেভ হয়েছে ✅')}catch(e){alert(e.message)}}
</script></body></html>
