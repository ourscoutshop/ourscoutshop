async function run(){$('#go').disabled=true;$('#lg').textContent='';
 try{const r=await(await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CFG.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value,returnSecureToken:true})})).json();if(r.error)throw new Error('লগইন ব্যর্থ');
 let ok=0;for(const p of D){const b={fields:{name:{stringValue:p.name},cat:{stringValue:p.cat},price:{doubleValue:p.price},old:{doubleValue:0},img:{stringValue:p.img},hot:{booleanValue:false}}};
  const x=await(await fetch(`https://firestore.googleapis.com/v1/projects/${CFG.pid}/databases/(default)/documents/products`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+r.idToken},body:JSON.stringify(b)})).json();
  if(x.error)log('❌ '+p.name+': '+x.error.message);else{ok++;log('✅ '+p.name)}}
 log('\nশেষ: '+ok+'/'+D.length+' যোগ হয়েছে')}catch(e){log('ত্রুটি: '+e.message);$('#go').disabled=false}}
