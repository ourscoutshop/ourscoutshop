const T=n=>'৳'+Math.round(n).toLocaleString('bn-BD'),E=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let P=[],cart=J('cart',{}),wish=J('wish',[]),cat='',Q='',cp=false,bn=[],bi=0;

 let b=[{t:'স্কাউট স্কার্ফে বিশেষ ছাড়',c:'স্কার্ফ'},{t:'নতুন বই এসেছে',c:'স্কাউট বই'},{t:'কি-রিং অফার',c:'কি-রিং'}];
 if(CFG.pid.startsWith('YOUR')){bn=b;return}
 try{const r=await(await fetch(base+'/products?pageSize=300&key='+CFG.key)).json();if(r.documents)P=r.documents.map(d=>({...fv(d),id:d.name.split('/').pop(),price:+fv(d).price||0,old:+fv(d).old||0}));

 bn=b}

function rg(){const l=P.filter(p=>(!cat||p.cat==cat)&&(!Q||(p.name+p.cat).includes(Q)));$('#pg').innerHTML=l.map(card).join('')||'<p class="hm" style="padding:12px">কোনো পণ্য পাওয়া যায়নি।</p>';
 const h=P.filter(p=>p.hot=='true'||p.hot===true);$('#hd').style.display=h.length?'':'none';$('#hg').innerHTML=h.map(card).join('');bd()}
function bd(){$('#cb').textContent=Object.values(cart).reduce((a,b)=>a+b,0);$('#wb').textContent=wish.length;S('cart',cart);S('wish',wish)}
function add(id,now){cart[id]=(cart[id]||0)+1;bd();now?chk():toast()}function toast(){$('#cb').style.transform='scale(1.5)';setTimeout(()=>$('#cb').style.transform='',300)}

setInterval(()=>{const n=new Date(),e=new Date(n);e.setHours(24,0,0,0);const s=Math.floor((e-n)/1e3);$('#cd').textContent=[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')},1e3);
const M=h=>{$('#mk').className='mk on';$('#md').innerHTML=h},cm=()=>$('#mk').className='mk';
function dr(){M(`<h2>মেনু</h2>`+CATS.map(c=>`<p style="padding:8px"><a href="#" onclick="pc('${c[0]}');cm();return false" style="color:inherit;text-decoration:none">${c[1]} ${c[0]}</a></p>`).join(''));$('#mk').className='mk on dr'}
const pd=id=>P.find(p=>p.id==id);
const sub=()=>Object.entries(cart).reduce((a,[i,q])=>a+(pd(i)?.price||0)*q,0);
function cartM(){const ids=Object.keys(cart).filter(pd);if(!ids.length)return M('<h2>কার্ট খালি</h2><button class="pb" onclick="cm()">কেনাকাটা করুন</button>');
 M(`<h2>আপনার কার্ট</h2>`+ids.map(i=>{const p=pd(i);return`<div class="ci"><div class="im" style="${p.img?`background-image:url('${E(p.img)}')`:''}">${p.img?'':'📦'}</div><div>${E(p.name)}<br><b class="pr">${T(p.price*cart[i])}</b></div><span class="qb"><button onclick="qt('${i}',-1)">−</button> ${cart[i]} <button onclick="qt('${i}',1)">+</button></span><button class="ic" onclick="delete cart[${JSON.stringify(i).replace(/"/g,"'")}];bd();cartM()">🗑</button></div>`}).join('')+

 $('#ax').innerHTML=`<div class="r"><span>সাবটোটাল</span><span>${T(o.s)}</span></div>${o.d?`<div class="r"><span>ছাড়</span><span>−${T(o.d)}</span></div>`:''}<div class="r"><span>ডেলিভারি</span><span>${T(CFG.ship)}</span></div><div class="r"><b>মোট বিল</b><b>${T(o.t)}</b></div><div class="r"><span>অগ্রিম</span><b>${T(o.a)}</b></div><div class="r"><span>বাকি</span><b>${T(o.t-o.a)}</b></div>`}
